<header class="flex items-center justify-between border-b border-black px-6 py-2">
  <a routerLink="/" aria-label="MDD, retour à l'accueil">
    <img src="images/logo.png" alt="" class="h-12 w-auto" />
  </a>

  @if (authService.isLoggedIn()) {
    <nav aria-label="Navigation principale" class="hidden items-center gap-8 md:flex">
      <ng-container [ngTemplateOutlet]="navigationLinks" />
    </nav>

    <button
      type="button"
      class="p-2 md:hidden"
      (click)="toggleMenu()"
      aria-controls="mobile-menu"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    @if (menuOpen()) {
      <div class="fixed inset-0 z-10 bg-black/40 md:hidden" (click)="closeMenu()" aria-hidden="true"></div>
      <nav
        id="mobile-menu"
        aria-label="Navigation principale"
        class="fixed top-0 right-0 z-20 flex h-full w-2/3 max-w-xs flex-col items-end gap-6 bg-white p-6 md:hidden"
      >
        <ng-container [ngTemplateOutlet]="navigationLinks" />
      </nav>
    }
  }
</header>

<!-- Written once, displayed inline on desktop and in the side menu on mobile -->
<ng-template #navigationLinks>
  <button type="button" (click)="logout()" class="text-sm text-red-700 hover:underline">Se déconnecter</button>
  <a
    routerLink="/feed"
    routerLinkActive="text-primary font-semibold"
    ariaCurrentWhenActive="page"
    (click)="closeMenu()"
    class="text-sm hover:underline"
    >Articles</a
  >
  <a
    routerLink="/topics"
    routerLinkActive="text-primary font-semibold"
    ariaCurrentWhenActive="page"
    (click)="closeMenu()"
    class="text-sm hover:underline"
    >Thèmes</a
  >
  <a
    routerLink="/profile"
    routerLinkActive="text-primary"
    ariaCurrentWhenActive="page"
    (click)="closeMenu()"
    aria-label="Mon profil"
    class="rounded-full hover:opacity-80"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24" class="h-10 w-10" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="10" />
      <circle cx="12" cy="10" r="3.5" />
      <path stroke-linecap="round" d="M5.5 18.5c1.5-2.5 3.8-3.7 6.5-3.7s5 1.2 6.5 3.7" />
    </svg>
  </a>
</ng-template>
