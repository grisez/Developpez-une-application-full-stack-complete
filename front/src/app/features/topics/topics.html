<app-header />

<main class="mx-auto max-w-5xl px-6 py-6 md:px-10">
  <h1 class="sr-only">Thèmes</h1>

  @let state = topics();
  @if (state.status === 'loaded') {
    <ul class="grid gap-4 md:grid-cols-2">
      @for (topic of state.value; track topic.id) {
        <li class="flex">
          <app-topic-card [topic]="topic" class="w-full">
            @if (topic.subscribed) {
              <button type="button" disabled class="mx-auto w-36 rounded-md bg-gray-400 py-2 text-sm text-white">
                Déjà abonné
              </button>
            } @else {
              <button
                type="button"
                (click)="subscribe(topic)"
                [disabled]="pending().has(topic.id)"
                attr.aria-label="S'abonner au thème {{ topic.name }}"
                class="mx-auto w-36 rounded-md bg-primary py-2 text-sm text-white hover:bg-primary-dark disabled:opacity-60"
              >
                S'abonner
              </button>
            }
          </app-topic-card>
        </li>
      } @empty {
        <li>Aucun thème pour le moment.</li>
      }
    </ul>
  } @else if (state.status === 'error') {
    <app-load-error message="Les thèmes n'ont pas pu être chargés." (retry)="load()" />
  } @else {
    <p role="status">Chargement des thèmes…</p>
  }
</main>
