<app-header class="hidden md:block" />

<main class="mx-auto flex max-w-sm flex-col px-6 py-6 md:max-w-4xl md:px-10">
  <a routerLink="/" aria-label="Retour à l'accueil" class="w-fit text-3xl leading-none">&larr;</a>

  <img src="images/logo.png" alt="" class="mx-auto mt-4 w-40 md:hidden" />

  <h1 class="mt-4 text-center text-xl font-semibold md:mt-0">Se connecter</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="mx-auto mt-6 flex w-full max-w-xs flex-col gap-4">
    <div class="flex flex-col gap-1">
      <label for="identifier" class="text-sm">E-mail ou nom d'utilisateur</label>
      <input
        id="identifier"
        type="text"
        appTrim
        formControlName="identifier"
        autocomplete="username"
        class="form-input"
        [attr.aria-invalid]="showError('identifier')"
        aria-describedby="identifier-error"
      />
      @if (showError('identifier')) {
        <p id="identifier-error" class="error-message">Veuillez saisir votre e-mail ou votre nom d'utilisateur.</p>
      }
    </div>

    <div class="flex flex-col gap-1">
      <label for="password" class="text-sm">Mot de passe</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        class="form-input"
        [attr.aria-invalid]="showError('password')"
        aria-describedby="password-error"
      />
      @if (showError('password')) {
        <p id="password-error" class="error-message">Veuillez saisir votre mot de passe.</p>
      }
    </div>

    @if (serverError(); as message) {
      <p role="alert" class="error-message text-center">{{ message }}</p>
    }

    <button type="submit" [disabled]="submitting()" class="btn-primary mx-auto mt-2 w-32 py-2">Se connecter</button>
  </form>
</main>
