server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security headers, inherited by every location below that declares no add_header of its own.
  # The CSP only allows the application's own files; inline styles stay allowed for the styles Angular injects.
  # It works because the critical CSS is not inlined (angular.json), which would need an inline onload handler.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  location /api/ {
    proxy_pass http://back:9000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # The bundles have a content hash in their name: a new version gets a new name, so they can be cached for a year
  location ~* \.(?:js|css)$ {
    expires 1y;
  }

  # index.html is revalidated on every visit, so that a new release is picked up at once
  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
