spring.application.name=mdd-api
server.port=9000

# Credentials are provided by environment variables only:
# SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD (and SPRING_DATASOURCE_URL in Docker).
spring.datasource.url=jdbc:mysql://localhost:3306/mdd

spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# The JWT signing key comes from the JWT_SECRET environment variable only (at least 32 characters).
mdd.security.jwt.secret=${JWT_SECRET:}
mdd.security.jwt.expiration=7d
mdd.security.jwt.cookie-secure=true

# API documentation: Swagger UI at /swagger-ui.html, OpenAPI description at /v3/api-docs.
# Swagger UI copies the XSRF-TOKEN cookie into the X-XSRF-TOKEN header, so that "Try it out" works for POST requests.
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
