name: CI

# Feature branches are checked through their pull request; develop and main after each merge
on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    name: Back-end build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: back/pom.xml
      # Tests, Testcontainers integration tests included, and the 70% JaCoCo coverage check
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: back-coverage
          path: back/target/site/jacoco

  front:
    name: Front-end lint, build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    env:
      # The end-to-end tests need the whole application running and are not part of this workflow
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: front-coverage
          path: front/coverage/mdd-client
